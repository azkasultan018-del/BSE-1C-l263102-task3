
<!DOCTYPE html>
<html>
<head>
<style>
 h1
body
    {
       background-color:lightgray;
    }

 h1      
    {
       text-align: center;
       color: red;
    }

 table
    {
        background-color: lightblue;
        border: 2px solid black;
        margin: auto;
        width: 700px;
    }

td 
    {
        border: 1px solid black;
        font-size: 20px;
    }

.label 
    {
         text-align: right;
         font-weight: bold;
    }
</style>
</head>

<body>

    <h1>Continental Hotel Reservation Form</h1>

<form>
 <table>
       <tr>
          <td class="label">Name</td>
          <td><input type="text" placeholder="Enter your name"></td>
        </tr>

        <tr>
           <td class="label">eMail</td>
           <td><input type="email" value="info@continental.pk"></td>
        </tr>

        <tr>
           <td class="label">Mobile No</td>
           <td><input type="text" placeholder="Enter your cell number"></td>
        </tr>

        <tr>
           <td class="label">Arrival Time</td>
           <td><input type="text" placeholder="Enter your arrival time"></td>
        </tr>

         <tr>
            <td class="label">Departure</td>
            <td>
               <input type="date">
               <input type="time">
             </td>
         </tr>

         <tr>
            <td class="label">Room Type</td>
            <td>
               <input type="radio" name="room">Single
               <input type="radio" name="room">Double
               <br>
               <input type="radio" name="room">Presidential Suite
             </td>
          </tr>

          <tr>
             <td class="label">Preferences</td>
             <td>
                <input type="checkbox">Non-Smoking
                <br>
                <input type="checkbox">Internet
                <br>
                <input type="checkbox">Firm Mattress
              </td>
          </tr>

          <tr>
             <td class="label">Mode of Payment</td>
             <td>
                <input type="checkbox">Cash
                <input type="checkbox">Check
                <br>
                 <input type="checkbox">Credit Card
              <select>
                     <option>Select Card</option>
                     <option>Visa</option>
                     <option>MasterCard</option>
               </select>
              </td>
          </tr>

          <tr>
             <td colspan="2" align="center">
             <input type="submit" value="Send Data">
             </td>
          </tr>
</table>
</form>

</body>
</html>
